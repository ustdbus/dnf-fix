plugins {
    id 'com.android.application'
}

android {
    namespace 'com.dnf.fix'
    compileSdk 34

    defaultConfig {
        applicationId "com.dnf.fix"
        minSdk 21
        targetSdk 34
        versionCode System.getenv("VERSION_CODE") ? Integer.parseInt(System.getenv("VERSION_CODE")) : 136
        versionName System.getenv("APP_VERSION") ?: "1.3.6"
    }

    signingConfigs {
        release {
            storeFile file("release.keystore")
            storePassword System.getenv("KEYSTORE_PASSWORD") ?: "ustdbus123456"
            keyAlias System.getenv("KEY_ALIAS") ?: "ustdbus"
            keyPassword System.getenv("KEY_PASSWORD") ?: "ustdbus123456"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // 纯轻量化零外部臃肿依赖
}
